<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff" id="theme-color-meta">
    <meta name="color-scheme" content="light dark">
    <title>Archivio</title>
    
    <meta name="description" content="Archivio guida TV">
    <meta property="og:title" content="Archivio">
    <meta property="og:description" content="Archivio guida TV">
    <meta property="og:image" content="https://guidatv-omega.vercel.app/output/guides/icona.png">
    <meta property="og:type" content="website">

    <link rel="icon" type="image/png" href="https://guidatv-omega.vercel.app/output/guides/icona.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,700;1,300;1,400&display=swap" rel="stylesheet">

    <script>
        (function() {
            var savedTheme = localStorage.getItem('theme');
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }

            var savedSize = localStorage.getItem('tv_font_size') || 'medium';
            var pxSize = '13px';
            if (savedSize === 'small') pxSize = '11px';
            if (savedSize === 'large') pxSize = '16px';
            if (savedSize === 'xlarge') pxSize = '19px';
            document.documentElement.style.setProperty('--base-font-size', pxSize);
        })();
    </script>

    <style>
        :root {
            --font-stack: "JetBrains Mono", monospace;
            --base-font-size: 13px;
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --dim-text: #555555;
            --border-color: #dddddd;
            --hover-bg: #f5f5f5;
            --accent-color: #0066cc;
        }

        [data-theme="dark"] {
            --bg-color: #000000;
            --text-color: #abb2bf;
            --dim-text: #737984;
            --border-color: #222222;
            --hover-bg: #111111;
            --accent-color: #58a6ff;
        }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 24px;
            font-size: var(--base-font-size);
            line-height: 1.6;
            transition: background-color 0.15s, color 0.15s;
            text-align: left;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed var(--border-color);
            margin-bottom: 24px;
            padding-bottom: 12px;
        }

        h1 {
            font-size: 1.25em;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .today-btn {
            display: none;
            cursor: pointer;
            background: none;
            border: 1px solid var(--border-color);
            padding: 0 8px;
            border-radius: 4px;
            height: 28px;
            font-family: var(--font-stack);
            font-size: 0.85em;
            color: var(--text-color);
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            white-space: nowrap;
        }

        .today-btn:hover {
            background-color: var(--hover-bg);
        }

        #info-btn {
            cursor: pointer;
            background: none;
            border: 1px solid var(--border-color);
            padding: 5px;
            border-radius: 4px;
            height: 28px;
            width: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        #info-btn:hover {
            background-color: var(--hover-bg);
        }

        #info-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
            color: var(--text-color);
        }

        .text-size-btn {
            position: relative;
            cursor: pointer;
            border: 1px solid var(--border-color);
            padding: 5px;
            border-radius: 4px;
            height: 28px;
            width: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .text-size-btn:hover {
            background-color: var(--hover-bg);
        }

        .text-size-btn svg {
            width: 16px;
            height: 16px;
            color: var(--text-color);
        }

        #size-select {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            border: none;
            background: transparent;
        }

        #theme-toggle {
            cursor: pointer;
            background: none;
            border: 1px solid var(--border-color);
            padding: 5px;
            border-radius: 4px;
            height: 28px;
            width: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        #theme-toggle:hover {
            background-color: var(--hover-bg);
        }

        #theme-toggle svg {
            width: 16px;
            height: 16px;
            color: var(--text-color);
        }

        .sun-icon { display: none; }
        [data-theme="dark"] .sun-icon { display: block; }
        [data-theme="dark"] .moon-icon { display: none; }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 32px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        select, input[type="date"] {
            font-family: var(--font-stack);
            background-color: transparent;
            color: var(--accent-color);
            border: none;
            border-bottom: 1px dashed var(--border-color);
            padding: 4px 0;
            font-size: 1.05em;
            font-weight: 700;
            outline: none;
            cursor: pointer;
            border-radius: 0;
        }

        select:focus, input[type="date"]:focus {
            border-bottom-color: var(--accent-color);
        }

        #schedule-container {
            margin-top: 20px;
            width: 100%;
        }

        .event-block {
            margin-bottom: 28px;
            width: 100%;
        }

        .event-time {
            color: var(--accent-color);
            font-weight: 700;
            font-size: 1.05em;
            margin-bottom: 2px;
        }

        .event-title {
            font-size: 1.25em;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .event-synopsis {
            color: var(--dim-text);
            font-size: 0.95em;
            font-style: italic;
            white-space: pre-line;
            font-weight: 300;
            text-align: justify;
        }

        #status-msg {
            color: var(--dim-text);
            font-style: italic;
        }

        dialog {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px 20px;
            font-family: var(--font-stack);
            font-size: var(--base-font-size);
            max-width: 320px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        dialog::backdrop {
            background: rgba(0, 0, 0, 0.4);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 12px;
        }

        .modal-title {
            font-weight: 700;
            font-size: 1.1em;
        }

        .modal-close-btn {
            background: none;
            border: none;
            color: var(--dim-text);
            font-family: var(--font-stack);
            font-size: 1.2em;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
        }

        .modal-close-btn:hover {
            color: var(--text-color);
        }

        @media (max-width: 600px) {
            body { padding: 16px; }
            select, input[type="date"] { width: 100%; }
            .control-group { width: 100%; }
        }
    </style>
</head>

    <dialog id="info-dialog">

            <span class="modal-title">Info archivio</span>
            <button type="button" id="close-dialog" class="modal-close-btn" aria-label="Chiudi">&times;</button>
        </div>
        <div id="modal-content"></div>

    <script>
        const INDEX_FILE = 'index_structure.json';
        let fileSystem = null;
        const fileCache = {};

        const themeToggle = document.getElementById('theme-toggle');
        const themeMeta = document.getElementById('theme-color-meta');
        const todayBtn = document.getElementById('today-btn');
        const infoBtn = document.getElementById('info-btn');
        const infoDialog = document.getElementById('info-dialog');
        const closeDialog = document.getElementById('close-dialog');
        const modalContent = document.getElementById('modal-content');

        function applyTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                if (themeMeta) themeMeta.setAttribute('content', '#000000');
            } else {
                document.documentElement.removeAttribute('data-theme');
                if (themeMeta) themeMeta.setAttribute('content', '#ffffff');
            }
        }

        const initialIsDark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (themeMeta) themeMeta.setAttribute('content', initialIsDark ? '#000000' : '#ffffff');

        themeToggle.addEventListener('click', () => {
            let isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            let nextTheme = isDark ? 'light' : 'dark';
            localStorage.setItem('theme', nextTheme);
            applyTheme(nextTheme);
        });

        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
                if (!localStorage.getItem('theme')) {
                    applyTheme(event.matches ? 'dark' : 'light');
                }
            });
        }

        function getTodayStr() {
            const localDate = new Date();
            const offset = localDate.getTimezoneOffset();
            const adjustedDate = new Date(localDate.getTime() - (offset * 60 * 1000));
            return adjustedDate.toISOString().split('T')[0];
        }

        function updateTodayBtnVisibility() {
            const dateSelect = document.getElementById('date-select');
            if (dateSelect.value && dateSelect.value !== getTodayStr()) {
                todayBtn.style.display = 'inline-flex';
            } else {
                todayBtn.style.display = 'none';
            }
        }

        infoBtn.addEventListener('click', () => {
            let updateText = "Non disponibile";
            if (fileSystem && fileSystem._meta && fileSystem._meta.last_saved) {
                const dateObj = new Date(fileSystem._meta.last_saved);
                if (!isNaN(dateObj.getTime())) {
                    updateText = dateObj.toLocaleString('it-IT', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    });
                } else {
                    updateText = fileSystem._meta.last_saved;
                }
            }
            modalContent.innerHTML = `<p style="margin: 0;"><strong>Ultimo aggiornamento:</strong><br>${updateText}</p>`;
            infoDialog.showModal();
        });

        closeDialog.addEventListener('click', () => {
            infoDialog.close();
        });

        infoDialog.addEventListener('click', (e) => {
            if (e.target === infoDialog) {
                infoDialog.close();
            }
        });

        async function init() {
            try {
                const resp = await fetch(INDEX_FILE);
                if (!resp.ok) throw new Error("Impossibile caricare l'indice dell'archivio.");
                fileSystem = await resp.json();
                
                setupControls();
                loadSchedule();
            } catch (err) {
                console.error('Errore durante il caricamento dell\'indice:', err);
                document.getElementById('status-msg').textContent = "Errore: " + err.message;
            }
        }

        function setupControls() {
            const channelSelect = document.getElementById('channel-select');
            const dateSelect = document.getElementById('date-select');
            const sizeSelect = document.getElementById('size-select');

            const channels = Object.keys(fileSystem).filter(ch => ch !== '_meta').sort((a, b) => a.localeCompare(b));
            
            channelSelect.innerHTML = '';
            channels.forEach(ch => {
                const opt = document.createElement('option');
                opt.value = ch;
                opt.textContent = ch;
                channelSelect.appendChild(opt);
            });

            let savedChannel = localStorage.getItem('tv_channel');
            if (savedChannel && channels.includes(savedChannel)) {
                channelSelect.value = savedChannel;
            } else if (channels.includes("Rai 1")) {
                channelSelect.value = "Rai 1";
                localStorage.setItem('tv_channel', "Rai 1");
            } else if (channels.length > 0) {
                channelSelect.value = channels[0];
                localStorage.setItem('tv_channel', channels[0]);
            }

            let savedDate = localStorage.getItem('tv_date');
            if (savedDate) {
                dateSelect.value = savedDate;
            } else {
                const todayStr = getTodayStr();
                dateSelect.value = todayStr;
                localStorage.setItem('tv_date', todayStr);
            }

            let savedSize = localStorage.getItem('tv_font_size') || 'medium';
            sizeSelect.value = savedSize;

            updateTodayBtnVisibility();

            channelSelect.addEventListener('change', () => {
                localStorage.setItem('tv_channel', channelSelect.value);
                loadSchedule();
            });

            dateSelect.addEventListener('change', () => {
                localStorage.setItem('tv_date', dateSelect.value);
                updateTodayBtnVisibility();
                loadSchedule();
            });

            todayBtn.addEventListener('click', () => {
                const todayStr = getTodayStr();
                dateSelect.value = todayStr;
                localStorage.setItem('tv_date', todayStr);
                updateTodayBtnVisibility();
                loadSchedule();
            });

            sizeSelect.addEventListener('change', () => {
                localStorage.setItem('tv_font_size', sizeSelect.value);
                applyFontSize(sizeSelect.value);
            });
        }

        function applyFontSize(size) {
            let pxSize = '13px';
            if (size === 'small') pxSize = '11px';
            if (size === 'large') pxSize = '16px';
            if (size === 'xlarge') pxSize = '19px';
            document.documentElement.style.setProperty('--base-font-size', pxSize);
        }

        function findFilePathForDate(channelName, targetDate) {
            const channelNode = fileSystem[channelName];
            if (!channelNode) return null;

            const foundFiles = [];
            
            function traverse(node, currentPath) {
                if (Array.isArray(node)) {
                    node.forEach(file => {
                        foundFiles.push({ pathParts: [...currentPath], fileName: file });
                    });
                } else if (typeof node === 'object' && node !== null) {
                    for (const key in node) {
                        traverse(node[key], [...currentPath, key]);
                    }
                }
            }
            
            traverse(channelNode, []);

            for (const fileObj of foundFiles) {
                const fileName = fileObj.fileName;
                
                if (fileName === `${targetDate}.txt`) {
                    return ['Archivio', channelName, ...fileObj.pathParts, fileName].join('/');
                }
                
                const rangeMatch = fileName.match(/^(\d{4}-\d{2}-\d{2})_to_(\d{4}-\d{2}-\d{2})\.txt$/);
                if (rangeMatch) {
                    const start = rangeMatch[1];
                    const end = rangeMatch[2];
                    if (targetDate >= start && targetDate <= end) {
                        return ['Archivio', channelName, ...fileObj.pathParts, fileName].join('/');
                    }
                }
            }
            return null;
        }

        function extractDayContent(fileText, targetDate) {
            const bannerRegex = /={50}\n📅 DATA: (\d{4}-\d{2}-\d{2})\n={50}\n/g;
            
            if (bannerRegex.test(fileText)) {
                bannerRegex.lastIndex = 0;
                const parts = fileText.split(/={50}\n📅 DATA: \d{4}-\d{2}-\d{2}\n={50}\n/);
                const dates = [];
                let match;
                while ((match = bannerRegex.exec(fileText)) !== null) {
                    dates.push(match[1]);
                }
                
                const dayIndex = dates.indexOf(targetDate);
                if (dayIndex !== -1 && parts[dayIndex + 1]) {
                    return parts[dayIndex + 1].trim();
                }
                console.warn('Data non trovata nel file per il canale/giorno richiesto:', targetDate, 'date disponibili:', dates);
                return null;
            } else {
                let clean = fileText.replace(/^Guida TV per .*? - \d{4}-\d{2}-\d{2}\n={50}\n/, '');
                return clean.trim();
            }
        }

        async function loadSchedule() {
            const channel = document.getElementById('channel-select').value;
            const date = document.getElementById('date-select').value;
            const container = document.getElementById('schedule-container');
            const statusMsg = document.getElementById('status-msg');

            container.innerHTML = '';
            statusMsg.style.display = 'block';
            statusMsg.textContent = "Caricamento palinsesto...";

            if (!channel || !date) {
                statusMsg.textContent = "Nessun canale o data selezionata.";
                return;
            }

            const filePath = findFilePathForDate(channel, date);
            if (!filePath) {
                console.warn('Nessun file di palinsesto trovato per', channel, date);
                statusMsg.innerHTML = "<em>Nessun palinsesto disponibile.</em>";
                return;
            }

            try {
                let rawText;
                if (fileCache[filePath]) {
                    rawText = fileCache[filePath];
                } else {
                    const resp = await fetch(filePath);
                    if (!resp.ok) throw new Error(`Richiesta fallita per ${filePath} (status ${resp.status})`);
                    rawText = await resp.text();
                    fileCache[filePath] = rawText;
                }

                const dayContent = extractDayContent(rawText, date);
                if (!dayContent) {
                    statusMsg.innerHTML = "<em>Nessun palinsesto disponibile.</em>";
                    return;
                }

                statusMsg.style.display = 'none';

                const blocks = dayContent.split(/\n-{30,}\n|\n-{30,}/);

                blocks.forEach(block => {
                    const lines = block.split('\n').map(l => l.trim()).filter(l => l);
                    if (lines.length === 0) return;

                    const titleLine = lines[0];
                    const timeMatch = titleLine.match(/^(\d{2}:\d{2})\s*-\s*(\d{2}:\d{2})\s*-\s*(.*)$/);

                    const eventDiv = document.createElement('div');
                    eventDiv.className = 'event-block';

                    if (timeMatch) {
                        const timeSpan = document.createElement('div');
                        timeSpan.className = 'event-time';
                        timeSpan.textContent = `${timeMatch[1]} - ${timeMatch[2]}`;
                        eventDiv.appendChild(timeSpan);

                        const titleSpan = document.createElement('div');
                        titleSpan.className = 'event-title';
                        titleSpan.textContent = timeMatch[3];
                        eventDiv.appendChild(titleSpan);
                    } else {
                        const titleSpan = document.createElement('div');
                        titleSpan.className = 'event-title';
                        titleSpan.textContent = titleLine;
                        eventDiv.appendChild(titleSpan);
                    }

                    const synopsisLines = lines.slice(1).filter(line => !/^[-_]+$/.test(line));
                    if (synopsisLines.length > 0) {
                        const synDiv = document.createElement('div');
                        synDiv.className = 'event-synopsis';
                        synDiv.textContent = synopsisLines.join('\n');
                        eventDiv.appendChild(synDiv);
                    }

                    container.appendChild(eventDiv);
                });

                if (container.children.length === 0) {
                    statusMsg.style.display = 'block';
                    statusMsg.innerHTML = "<em>Nessun palinsesto disponibile.</em>";
                }

            } catch (err) {
                console.error('Errore durante il caricamento del palinsesto:', err);
                statusMsg.style.display = 'block';
                statusMsg.innerHTML = "<em>Nessun palinsesto disponibile.</em>";
            }
        }

        init();
    </script>
</body>
</html>
