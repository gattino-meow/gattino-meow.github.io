name: Aggiornamento Archivio TV e Deploy

on:
  schedule:
    # Ogni Lunedì alle 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout del repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Installazione dipendenze
      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # Esecuzione script
      - name: Esecuzione script archivio
        run: python archivio.py

      # Configura Git
      - name: Configura Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # Commit e Push (mantiene un solo commit nella cronologia)
      - name: Commit e Push dei cambiamenti
        run: |
          git add Archivio/ index_structure.json

          if ! git diff --cached --quiet; then
            git commit --amend -m "Aggiornamento archivio TV $(date -u +'%Y-%m-%d %H:%M') UTC" \
            || git commit -m "Aggiornamento archivio TV $(date -u +'%Y-%m-%d %H:%M') UTC"

            git push --force
          else
            echo "Nessuna modifica da committare"
          fi
        shell: bash

      # Setup GitHub Pages
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # Carica l'artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # Deploy su GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
